name: CI

# Runs on every push to main and every pull request targeting main.
# Cloudflare Pages handles preview/production deploys separately via its
# own GitHub integration; this workflow only runs the test suite.
#
# Architecture: see DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same ref so a fast follow-up push doesn't
# burn double minutes. Matches Cloudflare Pages' own dedup behavior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Real Clerk + Supabase config from repo secrets.
  #
  # Why we need real values, not dummies: <ClerkProvider> mounts at the
  # router root regardless of the auth-bypass flag (the bypass replaces
  # the *hooks*, not the provider). Clerk's provider eagerly validates
  # the publishable key on mount -- not just the format-prefix check we
  # do in src/lib/env.ts, but a deeper decode of the embedded Frontend
  # API URL. A made-up "pk_test_..." string passes our prefix check and
  # then crashes inside ClerkProviderBase, which crashes the React tree,
  # which means <AppLayout> never mounts, which means
  # startAnalysisQueue() never fires, which means tests like full-queue
  # and heal time out waiting for games to be analyzed.
  #
  # These values are public-by-design (they already ship in every user's
  # browser bundle in production). The repo secrets are operational
  # hygiene -- not a security boundary -- and let us rotate without a
  # workflow edit if we ever need to.
  VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  unit:
    name: Typecheck + unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Production build parity: Cloudflare Pages owns the real production
      # build, but we don't want a Vite-only break (plugin misconfig,
      # missing import, runtime-only code path that survives `tsc`) to
      # surface for the first time in CF's build log on a deploy. Running
      # `vite build` in CI is cheap on the same checkout (~10–20 s) and
      # closes the gap. Output goes to `dist/`, which CI throws away.
      - name: Production build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm run test:unit

      # Integration tests need:
      #   - a running dev server on :5173 (the harness pings it up front)
      #   - Playwright Chromium with system dependencies
      # We start the dev server in the background, wait for it, then run
      # the suite. `set -e` + the kill on EXIT guarantee the server is
      # cleaned up even on test failure.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          # Wait up to 60s for Vite to start serving.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "Dev server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start within 60s. Last 200 lines of log:"
          tail -200 /tmp/vite.log
          exit 1

      - name: Integration tests
        run: npm run test:integration

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/vite.pid ]; then
            kill $(cat /tmp/vite.pid) 2>/dev/null || true
          fi

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-traces
          path: |
            test-results/
            /tmp/vite.log
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "Dev server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start within 60s. Last 200 lines of log:"
          tail -200 /tmp/vite.log
          exit 1

      - name: e2e tests
        run: npm run test:e2e

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/vite.pid ]; then
            kill $(cat /tmp/vite.pid) 2>/dev/null || true
          fi

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: |
            test-results/
            /tmp/vite.log
          retention-days: 7
          if-no-files-found: ignore
